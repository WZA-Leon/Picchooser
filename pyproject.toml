[project]
name = "picchooser"
version = "1.0.0"
description = "基于 EXIF 拍摄时间的照片自动整理工具，按拍摄间隔归类连拍与孤立照片"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "WZA-Leon" }]
keywords = ["exif", "photo", "classify", "copy", "move", "burst"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["exifread>=3.0.0"]

[project.urls]
Homepage = "https://github.com/WZA-Leon/Picchooser"
Repository = "https://github.com/WZA-Leon/Picchooser"

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["Picchooser.py"]
sources = ["."]

[tool.uv]
package = false

# ===================== 打包（PyInstaller，单文件） =====================
# 打包配置在 Picchooser.spec 中；pyinstaller 由 dev 依赖组提供。
# 打包：uv run pyinstaller Picchooser.spec --noconfirm --clean
# 产物：dist\picc.exe（单文件，免安装）
